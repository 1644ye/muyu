name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Check tag and version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw 'Tag/package version mismatch' }
      - name: Generate examples and test (no npm dependencies)
        run: npm test
      - name: Build and verify portable runtime
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Verify extracted final archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-portable.zip
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath release-verify
          $app = (Get-ChildItem release-verify -Directory).FullName
          & "$app/runtime/node.exe" scripts/verify-release.cjs $app
          if ($LASTEXITCODE -ne 0) { throw 'Extracted archive verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-portable
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64-portable
          path: dist
      - name: Check hashes, create draft, upload all files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # Existing releases are never overwritten, including drafts from failed uploads.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it manually; no assets overwritten.' >&2
            exit 1
          fi
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "幕予 $RELEASE_TAG" --notes-file release/NOTES.md "${args[@]}"
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
